<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3efe7">
<title>ZivugArch Fresh — Calm UI Prototype</title>
<style>
:root{
  --bg:#f3efe7;--surface:#fbfaf6;--surface2:#ece7de;--line:#ded7cb;--ink:#23302c;--muted:#7b827d;
  --accent:#597d6a;--accent2:#7690a3;--gold:#bd9d62;--rose:#b98074;
  --soft:#e3ebe5;--soft2:#e4eaf0;--soft3:#f3ebd8;--soft4:#f3e4df;
  --shadow:0 10px 35px rgba(49,44,37,.07);--r:22px;--nav:74px;
}
:root[data-theme="dark"]{
  --bg:#141816;--surface:#1d2320;--surface2:#272e2a;--line:#323b36;--ink:#edf2ef;--muted:#a0aaa4;
  --accent:#94b69f;--accent2:#9fb5c6;--gold:#d6bc82;--rose:#d8a79d;
  --soft:#26372d;--soft2:#27343e;--soft3:#3a3220;--soft4:#3b2925;--shadow:0 10px 35px rgba(0,0,0,.24)
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}body{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}button,input{font:inherit}.app{max-width:520px;margin:auto;min-height:100vh}.page{padding:18px 16px 28px}.hidden{display:none!important}
.topline{display:flex;align-items:center;gap:10px;margin-bottom:18px}.brand{flex:1}.brand small{display:block;color:var(--accent);font-size:10px;font-weight:900;letter-spacing:.11em;text-transform:uppercase}.brand h1{font:600 27px/1.08 Georgia,serif;margin:3px 0 0;letter-spacing:-.02em}.roundbtn{width:40px;height:40px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center}.roundbtn svg,.nav svg,.action svg,.mini-icon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hero{position:relative;overflow:hidden;border:1px solid var(--line);background:linear-gradient(145deg,var(--surface),var(--soft));border-radius:26px;padding:17px 16px;margin-bottom:17px;box-shadow:var(--shadow)}.hero:after{content:"";position:absolute;width:120px;height:120px;border-radius:50%;background:var(--soft2);right:-42px;top:-56px;opacity:.7}.hero-k{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.hero-title{font:600 22px Georgia,serif;margin:4px 0 5px;max-width:78%}.hero-sub{font-size:12.5px;color:var(--muted);max-width:82%}.hero-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px}.hero-stat{background:color-mix(in srgb,var(--surface) 82%,transparent);border:1px solid color-mix(in srgb,var(--line) 75%,transparent);border-radius:15px;padding:9px}.hero-stat b{display:block;font-size:18px}.hero-stat span{font-size:9.5px;color:var(--muted);line-height:1.1;display:block;margin-top:1px}
.searchbar{display:flex;align-items:center;gap:9px;height:46px;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:0 12px;margin:0 0 13px}.searchbar svg{width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:1.8}.searchbar input{border:0;outline:0;background:transparent;flex:1;min-width:0;color:var(--ink)}.searchbar input::placeholder{color:var(--muted)}
.headrow{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 8px}.headrow h2{font-size:13px;margin:0;letter-spacing:.01em}.headrow button,.headrow span{font-size:11px;color:var(--muted);border:0;background:none}.switchline{display:flex;gap:6px;overflow:auto;scrollbar-width:none;margin-bottom:11px}.switchline::-webkit-scrollbar{display:none}.pill{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 11px;color:var(--muted);font-size:11.5px;font-weight:800}.pill.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.feed{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}.feedrow{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;min-height:68px;padding:10px 12px;border:0;background:transparent;color:inherit;text-align:left;width:100%;position:relative}.feedrow+.feedrow:before{content:"";position:absolute;left:64px;right:0;top:0;border-top:1px solid var(--line)}.bubble{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;font-weight:900;font-size:12px;background:var(--soft);color:var(--accent)}.bubble.blue{background:var(--soft2);color:var(--accent2)}.bubble.gold{background:var(--soft3);color:#9a7b3c}.bubble.rose{background:var(--soft4);color:var(--rose)}.main{min-width:0}.rowtitle{font-size:13.5px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rowsub{font-size:11.8px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rowmeta{font-size:10.5px;color:var(--muted);text-align:right}.status{margin-top:4px;display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 7px;font-size:9.5px;font-weight:900;background:var(--soft);color:var(--accent)}.status.them{background:var(--soft3);color:#967329}.status.me{background:var(--soft2);color:var(--accent2)}.status.ended{background:var(--surface2);color:var(--muted)}
.focuscard{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:13px 14px;margin-bottom:10px}.focuscard .label{font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:900}.focuscard .value{font-size:13.5px;font-weight:850;margin-top:3px}.focuscard .sub{font-size:11.5px;color:var(--muted);margin-top:2px}.attention-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:15px}.attention-card{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:12px}.attention-card b{display:block;font-size:21px}.attention-card span{font-size:10px;color:var(--muted)}.attention-card.gold b{color:#a4833f}.attention-card.blue b{color:var(--accent2)}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0 16px}.action{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 3px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;color:var(--ink);font-size:9.5px;font-weight:750}.action svg{color:var(--accent)}
.detailtop{display:flex;gap:9px;align-items:center;margin-bottom:12px}.detailtop .back{border:0;background:none;width:32px;height:32px;color:var(--ink)}.personhead{display:flex;align-items:center;gap:12px;padding:8px 2px 13px}.bigbubble{width:58px;height:58px;border-radius:20px;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-size:17px;font-weight:900}.personhead h1{font:600 25px Georgia,serif;margin:0}.personhead p{font-size:11.5px;color:var(--muted);margin:3px 0 0}
.info-block{border:1px solid var(--line);background:var(--surface);border-radius:20px;overflow:hidden;margin-bottom:12px}.info-row{display:flex;gap:12px;padding:11px 13px;border-bottom:1px solid var(--line)}.info-row:last-child{border-bottom:0}.info-row label{width:105px;color:var(--muted);font-size:11px}.info-row div{flex:1;font-size:12px;font-weight:800}
.timeline{border-left:1px solid var(--line);margin-left:11px;padding-left:19px}.event{position:relative;padding:0 0 15px}.event:before{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:var(--accent);left:-24px;top:4px;box-shadow:0 0 0 4px var(--bg)}.event h3{font-size:12px;margin:0}.event p{font-size:11px;color:var(--muted);margin:3px 0 0}.event time{font-size:9.5px;color:var(--muted);display:block;margin-top:3px}
.primary{width:100%;border:0;border-radius:15px;background:var(--ink);color:var(--surface);font-weight:850;padding:12px}.split{display:grid;grid-template-columns:1fr 1fr;gap:8px}.secondary{border:1px solid var(--line);background:var(--surface);border-radius:15px;color:var(--ink);font-weight:800;padding:11px}
.nav{position:fixed;z-index:30;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100%);height:calc(var(--nav) + env(safe-area-inset-bottom));padding:7px 5px env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(16px)}.nav button{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:9px;font-weight:750}.nav button.on{color:var(--accent)}
.scrim{position:fixed;z-index:60;inset:0;background:rgba(17,22,19,.38);display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(520px,100%);background:var(--surface);border-radius:26px 26px 0 0;padding:9px 18px calc(26px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}.handle{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 16px}.sheet h2{font:600 23px Georgia,serif;margin:0 0 4px}.sheet p{font-size:11.5px;color:var(--muted);margin:0 0 14px}.setrow{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}.setrow label{font-size:12px;font-weight:850}.opts{display:flex;gap:5px}.opt{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:6px 9px;color:var(--muted);font-size:10px;font-weight:800}.opt.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
@media(max-width:370px){.hero-row{grid-template-columns:1fr 1fr}.hero-stat:last-child{grid-column:span 2}.brand h1{font-size:24px}.nav button{font-size:8.2px}}
</style>
</head>
<body>
<div class="app" id="app"></div><div id="overlay"></div>
<script>
const $=s=>document.querySelector(s);
const icons={
 recent:'<path d="M4 13a8 8 0 1 0 2-5.3L4 10"/><path d="M4 5v5h5"/><path d="M12 8v5l3 2"/>',
 guys:'<circle cx="12" cy="8" r="3"/><path d="M5 20c.8-4 3.2-6 7-6s6.2 2 7 6"/>',
 girls:'<circle cx="12" cy="8" r="3"/><path d="M5 20c.8-4 3.2-6 7-6s6.2 2 7 6"/><path d="M18 5h3m-1.5-1.5v3"/>',
 shad:'<path d="M7 18a4 4 0 0 1 4-4h2a4 4 0 0 1 4 4"/><circle cx="12" cy="8" r="3"/><path d="M3 11h3m12 0h3"/>',
 match:'<path d="M8 6c-2 0-4 1.5-4 4 0 4 8 9 8 9s8-5 8-9c0-2.5-2-4-4-4-1.7 0-3 1-4 2.4C11 7 9.7 6 8 6z"/>',
 search:'<circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/>',settings:'<path d="M4 6h16M7 12h10M10 18h4"/>',back:'<path d="m15 18-6-6 6-6"/>',call:'<path d="M6 3h4l1 5-2 2c1.2 2.4 2.9 4.1 5.4 5.3l1.9-2 4.7 1.1v4c0 1-.8 1.8-1.8 1.8C10.4 20.2 3.8 13.6 3.8 4.8 3.8 3.8 4.6 3 5.6 3z"/>',msg:'<path d="M4 5h16v11H9l-5 4z"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/>',note:'<path d="M5 3h14v18H5z"/><path d="M8 8h8M8 12h8M8 16h5"/>'};
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[n]||'<circle cx="12" cy="12" r="8"/>'}</svg>`;
const state={screen:'recent',detail:null,mode:localStorage.fMode||'single',theme:localStorage.fTheme||'warm',view:'All'};
const recent=[
 {a:'M',tone:'gold',title:'Miriam',sub:'“She’s thinking about it. I’ll ask tonight.”',meta:'14:05',status:'Waiting on them',kind:'them'},
 {a:'R',tone:'blue',title:'Rivka',sub:'10 shadchanim · 6 contacted · 3 replied',meta:'11:20',status:'Source updated',kind:''},
 {a:'Mo',tone:'blue',title:'Moshe',sub:'Leah profile v1 · asked for an opinion',meta:'09:30',status:'Waiting on them',kind:'them'},
 {a:'L',tone:'gold',title:'Leah',sub:'Profile received from Miriam',meta:'Yesterday',status:'Idea for me',kind:''},
 {a:'B',tone:'rose',title:'Batya',sub:'No reply since Sep 2',meta:'Sep 2',status:'Follow-up',kind:'me'}
];
const girls=[['Leah Rosen','Jerusalem · 34 · Teacher','Idea for me'],['Tamar Gold','Jerusalem · 33 · Accountant','Idea for me'],['Noa Weiss','Beit Shemesh · 36 · Designer','Previous'],['Rina Cohen','Tzfat · 35 · Therapist','Previous']];
const guys=[['David Klein','Jerusalem · 35 · Engineer','Available'],['Moshe Green','Tzfat · 39 · Teacher','Available'],['Ari Stern','Beit Shemesh · 36 · Accountant','Available'],['Yossi Katz','Jerusalem · 34 · Architect','Available']];
const fn=['Miriam','Batya','Dina','Chana','Rivka','Sara','Esther','Tova','Rachel','Nechama','Shira','Malky','Devorah','Rina'];const ln=['Cohen','Levy','Friedman','Weiss','Katz','Green','Stern','Gold'];const cities=['Jerusalem','Beit Shemesh','Haifa','Tzfat','Bnei Brak','Tel Aviv'];
const shads=Array.from({length:112},(_,i)=>({name:`${fn[i%fn.length]} ${ln[Math.floor(i/fn.length)%ln.length]}`,city:cities[i%cities.length],status:i%7===0?'me':i%4===0?'them':i%11===0?'new':'ok',last:i%11===0?'New':`${(i%24)+1}d`}));
const matches=[['Me ↔ Leah','Round 1 · waiting for her side','them'],['David ↔ Noa','Active · Date 2','active'],['Moshe ↔ Tamar','Idea · not started','idea'],['Ari ↔ Rina','Ended · 3 dates','ended']];
function apply(){document.documentElement.dataset.theme=state.theme==='dark'?'dark':'light'}
function top(title,sub=''){return `<div class="topline"><div class="brand"><small>ZivugArch Fresh</small><h1>${title}</h1>${sub?`<div style="font-size:11px;color:var(--muted);margin-top:3px">${sub}</div>`:''}</div><button class="roundbtn" onclick="openSettings()">${icon('settings')}</button></div>`}
function search(ph,fn=''){return `<div class="searchbar">${icon('search')}<input placeholder="${ph}" ${fn?`oninput="${fn}"`:''}></div>`}
function feedRow(x){let click=x.title==='Miriam'?"openPerson('shad','Miriam Cohen')":x.title==='Leah'?"openPerson('girl','Leah Rosen')":"void 0";return `<button class="feedrow" onclick="${click}"><div class="bubble ${x.tone}">${x.a}</div><div class="main"><div class="rowtitle">${x.title}</div><div class="rowsub">${x.sub}</div><span class="status ${x.kind}">${x.status}</span></div><div class="rowmeta">${x.meta}</div></button>`}
function recentScreen(){return `${top('Recent','A calm view of what matters now')}<div class="hero"><div class="hero-k">Today</div><div class="hero-title">Two things need you</div><div class="hero-sub">Everything else can wait. The app keeps the history underneath.</div><div class="hero-row"><div class="hero-stat"><b>3</b><span>Waiting on me</span></div><div class="hero-stat"><b>6</b><span>Waiting on them</span></div><div class="hero-stat"><b>4</b><span>Follow-ups</span></div></div></div>${search('Search people, messages, profiles…')}<div class="headrow"><h2>Recent activity</h2><button onclick="openFilters()">Filter</button></div><div class="feed">${recent.map(feedRow).join('')}</div>`}
function peopleScreen(kind){const isGirl=kind==='girls',data=isGirl?girls:guys;return `${top(isGirl?'Girls':'Guys',isGirl&&state.mode==='single'?'Single Mode · only what is relevant to you':'Browse and search')}${search('Search name, city…')}<div class="switchline">${(isGirl&&state.mode==='single'?['For me','Previous']:['All','Recently added']).map((x,i)=>`<button class="pill ${i===0?'on':''}">${x}</button>`).join('')}</div><div class="feed">${data.map((p,i)=>`<button class="feedrow" onclick="openPerson('${isGirl?'girl':'guy'}','${p[0]}')"><div class="bubble ${isGirl?'gold':'blue'}">${p[0].split(' ').map(x=>x[0]).join('').slice(0,2)}</div><div class="main"><div class="rowtitle">${p[0]}</div><div class="rowsub">${p[1]}</div><span class="status">${p[2]}</span></div><div class="rowmeta">›</div></button>`).join('')}</div>`}
function shadScreen(){return `${top('Shadchanim','112 people · simple by default')}${search('Search name, phone or city…','filterShads(this.value)')}<div class="attention-grid"><button class="attention-card gold" onclick="state.view='them';render()"><b>6</b><span>Waiting on them</span></button><button class="attention-card blue" onclick="state.view='me';render()"><b>3</b><span>Waiting on me</span></button></div><div class="switchline">${[['All','All'],['Needs attention','attention'],['Sources','sources']].map(([label,v])=>`<button class="pill ${state.view===v||state.view==='All'&&v==='All'?'on':''}" onclick="state.view='${v}';render()">${label}</button>`).join('')}</div>${state.view==='sources'?sourceCards():`<div class="feed" id="shads">${shadRows()}</div>`}`}
function shadRows(q=''){return shads.filter(s=>{if(q&&!`${s.name} ${s.city}`.toLowerCase().includes(q.toLowerCase()))return false;if(state.view==='them')return s.status==='them';if(state.view==='me')return s.status==='me';if(state.view==='attention')return s.status==='them'||s.status==='me'||s.status==='new';return true}).slice(0,28).map(s=>`<button class="feedrow" onclick="openPerson('shad','${s.name}')"><div class="bubble">${s.name.split(' ').map(x=>x[0]).join('').slice(0,2)}</div><div class="main"><div class="rowtitle">${s.name}</div><div class="rowsub">${s.city} · ${s.status==='new'?'never contacted':'last contact '+s.last}</div>${s.status==='them'?'<span class="status them">Waiting on them</span>':s.status==='me'?'<span class="status me">Waiting on me</span>':s.status==='new'?'<span class="status ended">Needs contact</span>':''}</div><div class="rowmeta">${s.last}</div></button>`).join('')}
function filterShads(q){const el=$('#shads');if(el)el.innerHTML=shadRows(q)}
function sourceCards(){return `<div class="focuscard" onclick="openSource()"><div class="label">Source</div><div class="value">Rivka’s 10 shadchanim</div><div class="sub">10 total · 6 contacted · 3 replied · 1 follow-up</div></div><div class="focuscard"><div class="label">Event</div><div class="value">Tzfat shidduch evening</div><div class="sub">18 people · Jan 12</div></div><div class="focuscard"><div class="label">List</div><div class="value">Sarah’s list</div><div class="sub">50 people · 31 already here</div></div>`}
function matchScreen(){return `${top('Shidduchim','Only actual pairings and ideas')}${search('Search a pair…')}<div class="switchline"><button class="pill on">Active</button><button class="pill">Ideas</button><button class="pill">Ended</button></div><div class="feed">${matches.map(m=>`<button class="feedrow" onclick="openMatch('${m[0]}')"><div class="bubble ${m[2]==='active'?'':'gold'}">♥</div><div class="main"><div class="rowtitle">${m[0]}</div><div class="rowsub">${m[1]}</div><span class="status ${m[2]==='them'?'them':m[2]==='ended'?'ended':''}">${m[2]==='them'?'Waiting on them':m[2]}</span></div><div class="rowmeta">›</div></button>`).join('')}</div>`}
function openPerson(type,name){state.detail={kind:'person',type,name};render();window.scrollTo(0,0)}function openMatch(name){state.detail={kind:'match',name};render();window.scrollTo(0,0)}function openSource(){state.detail={kind:'source'};render();window.scrollTo(0,0)}function closeDetail(){state.detail=null;render()}
function detailHeader(d,sub){return `<div class="detailtop"><button class="back" onclick="closeDetail()">${icon('back')}</button><div class="brand"><small>ZivugArch Fresh</small><h1>${d}</h1><div style="font-size:11px;color:var(--muted);margin-top:3px">${sub}</div></div></div>`}
function personDetail(d){const shad=d.type==='shad',girl=d.type==='girl';return `${detailHeader(d.name,shad?'Shadchan · Jerusalem':girl?'Girl · profile saved':'Guy · profile saved')}<div class="personhead"><div class="bigbubble">${d.name.split(' ').map(x=>x[0]).join('').slice(0,2)}</div><div><h1>${d.name}</h1><p>${shad?'Last contact Aug 21 · 5 sources':girl?'34 · Jerusalem · Teacher':'35 · Jerusalem · Engineer'}</p></div></div><div class="actions"><button class="action">${icon('call')}Call</button><button class="action">${icon('msg')}WhatsApp</button><button class="action">${icon('mail')}Email</button><button class="action">${icon('note')}Note</button></div>${shad?`<div class="focuscard"><div class="label">Needs attention</div><div class="value">Waiting for Leah’s feedback</div><div class="sub">3 days · via Miriam</div></div><div class="focuscard"><div class="label">Your next action</div><div class="value">Send updated profile v3</div><div class="sub">She currently has v2</div></div>`:girl?`<div class="hero"><div class="hero-k">Idea for me</div><div class="hero-title" style="font-size:20px">Suggested by Miriam</div><div class="hero-sub">No shidduch record exists yet.</div><div class="split" style="margin-top:12px"><button class="secondary">Not applicable</button><button class="primary" onclick="openMatch('Me ↔ Leah')">Interested</button></div></div>`:''}<div class="headrow"><h2>At a glance</h2></div><div class="info-block"><div class="info-row"><label>Last contact</label><div>Call · Aug 21</div></div><div class="info-row"><label>How I know ${shad?'her':'them'}</label><div>Met Jan 12 · +4 sources ›</div></div><div class="info-row"><label>${shad?'My profile':'Profile'}</label><div>${shad?'Has v2 · v3 ready':'Version 1 · from Miriam'}</div></div></div><div class="headrow"><h2>History</h2><span>All</span></div>${timeline()}`}
function timeline(){return `<div class="timeline"><div class="event"><h3>WhatsApp message</h3><p>“She’s thinking about it. I’ll ask tonight.”</p><time>Today · 14:05</time></div><div class="event"><h3>Call</h3><p>Spoke for 7 minutes · Leah discussed</p><time>Aug 21</time></div><div class="event"><h3>Profile received</h3><p>Leah profile v1</p><time>Aug 3</time></div></div>`}
function matchDetail(d){return `${detailHeader(d.name,'Round 1 · active')}<div class="hero"><div class="hero-k">Current state</div><div class="hero-title">Waiting for her side</div><div class="hero-sub">Miriam said she is thinking about it. Nothing else needs your attention right now.</div></div><div class="attention-grid"><div class="attention-card"><b style="color:var(--accent)">Yes</b><span>My side</span></div><div class="attention-card gold"><b>…</b><span>Her side</span></div></div><div class="focuscard"><div class="label">Waiting on them</div><div class="value">Her answer via Miriam</div><div class="sub">Open 3 days</div></div><div class="headrow"><h2>Dates</h2><span>See all</span></div><div class="feed"><button class="feedrow"><div class="bubble blue">1</div><div class="main"><div class="rowtitle">Date 1</div><div class="rowsub">Thu Aug 13 · happened</div><span class="status">Both feedback in</span></div><div class="rowmeta">›</div></button></div><div class="headrow"><h2>History</h2></div>${timeline()}`}
function sourceDetail(){return `${detailHeader('Rivka’s 10','Source · Jun 8 · WhatsApp')}<div class="hero"><div class="hero-k">Source progress</div><div class="hero-title">10 shadchanim</div><div class="hero-sub">The source updates by itself when you contact someone anywhere in the app.</div><div class="hero-row"><div class="hero-stat"><b>6</b><span>Contacted</span></div><div class="hero-stat"><b>3</b><span>Replied</span></div><div class="hero-stat"><b>1</b><span>Follow-up</span></div></div></div><div class="headrow"><h2>People</h2></div><div class="feed">${shads.slice(0,10).map((s,i)=>`<button class="feedrow" onclick="openPerson('shad','${s.name}')"><div class="bubble">${s.name.split(' ').map(x=>x[0]).join('').slice(0,2)}</div><div class="main"><div class="rowtitle">${s.name}</div><div class="rowsub">${i<3?'Replied':i<6?'Contacted':i===6?'Follow up':'Not contacted'}</div></div><div class="rowmeta">›</div></button>`).join('')}</div>`}
function nav(){return `<nav class="nav">${[['recent','recent','Recent'],['guys','guys','Guys'],['girls','girls','Girls'],['shadchanim','shad','Shadchanim'],['shidduchim','match','Shidduchim']].map(([s,i,l])=>`<button class="${state.screen===s?'on':''}" onclick="setScreen('${s}')">${icon(i)}<span>${l}</span></button>`).join('')}</nav>`}
function setScreen(s){state.screen=s;state.detail=null;state.view='All';render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){apply();let body;if(state.detail){body=state.detail.kind==='person'?personDetail(state.detail):state.detail.kind==='match'?matchDetail(state.detail):sourceDetail()}else if(state.screen==='recent')body=recentScreen();else if(state.screen==='girls'||state.screen==='guys')body=peopleScreen(state.screen);else if(state.screen==='shadchanim')body=shadScreen();else body=matchScreen();$('#app').innerHTML=`<main class="page">${body}</main>${nav()}`}
function openSettings(){$('#overlay').innerHTML=`<div class="scrim" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="handle"></div><h2>View</h2><p>Keep the main screens quiet. Put preferences here.</p><div class="setrow"><label>Mode</label><div class="opts"><button class="opt ${state.mode==='single'?'on':''}" onclick="pref('mode','single')">Single</button><button class="opt ${state.mode==='shadchan'?'on':''}" onclick="pref('mode','shadchan')">Shadchan</button></div></div><div class="setrow"><label>Theme</label><div class="opts"><button class="opt ${state.theme==='warm'?'on':''}" onclick="pref('theme','warm')">Warm</button><button class="opt ${state.theme==='dark'?'on':''}" onclick="pref('theme','dark')">Dark</button></div></div><div class="setrow"><label>Advanced filters</label><button class="opt" onclick="closeSheet();openFilters()">Open</button></div><button class="primary" style="margin-top:14px" onclick="closeSheet()">Done</button></div></div>`}
function openFilters(){$('#overlay').innerHTML=`<div class="scrim" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="handle"></div><h2>Filters</h2><p>Secondary controls stay off the main screen.</p><div class="setrow"><label>Needs contact</label><button class="opt">Show</button></div><div class="setrow"><label>Dormant 60+ days</label><button class="opt">Show</button></div><div class="setrow"><label>Sort</label><div class="opts"><button class="opt on">Last contact</button><button class="opt">A–Z</button></div></div><div class="setrow"><label>Group</label><div class="opts"><button class="opt on">None</button><button class="opt">Source</button></div></div><button class="primary" style="margin-top:14px" onclick="closeSheet()">Done</button></div></div>`}
function pref(k,v){state[k]=v;if(k==='mode')localStorage.fMode=v;if(k==='theme')localStorage.fTheme=v;apply();openSettings();render()}function closeSheet(){$('#overlay').innerHTML=''}
render();
</script>
</body>
</html>
