name: Deploy ZivugMatch

on:
  push:
    branches: [main, test]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out stable
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable

      - name: Check out test
        uses: actions/checkout@v4
        with:
          ref: test
          path: test-build

      - name: Build Stable + Test site
        run: |
          mkdir -p public/test
          rsync -a --exclude='.git' stable/ public/
          rsync -a --exclude='.git' test-build/ public/test/

      # Test only: its commit becomes the build ID (file addresses, its own service-worker cache, build.txt),
      # so each Test deploy shows on the phone at the next open. Stable is not touched.
      - name: Stamp Test with its build ID
        run: node test-build/tools/stamp-build.cjs public/test "$(git -C test-build rev-parse --short=7 HEAD)"

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
